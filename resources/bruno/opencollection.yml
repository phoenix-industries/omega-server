opencollection: 1.0.0

info:
  name: omega-server
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{AUTH_DATA.access_token}}"
  variables:
    - name: HOST
      value: localhost
    - name: PORT
      value: "5000"
    - name: BASE_URL
      value: http://{{HOST}}:{{PORT}}
      disabled: true
    - name: BASE_URL
      value: https://osama.alwaysdata.net
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
    presets:
      request:
        type: http
        url: "{{BASE_URL}}"
